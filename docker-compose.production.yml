services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codeforge-app
    dns:
    - 8.8.8.8
    - 1.1.1.1
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
     - /home/ubuntu/codeforge-workspaces:/home/ubuntu/codeforge-workspaces
     - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - postgres
      - redis
    expose:
      - "3000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: codeforge-worker
    dns:
    - 8.8.8.8
    - 1.1.1.1
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
     - /home/ubuntu/codeforge-workspaces:/home/ubuntu/codeforge-workspaces
     - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    container_name: codeforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: codeforge
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: codeforge-redis
    restart: unless-stopped

  caddy:
    image: caddy:2
    container_name: codeforge-caddy
    dns:
    - 8.8.8.8
    - 1.1.1.1
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
